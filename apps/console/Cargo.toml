[package]
name = "sa-forge-signer-console"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "A read-only desktop view (GPUI Kit) of an sa-forge-signer: serve health, the audit log and per-key limits. Spike."
license = "Unlicense OR MIT"
publish = false

# Its own workspace: kept out of the signer's build, release and dependency gates.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gpui-kit = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
ureq = "3.4.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
