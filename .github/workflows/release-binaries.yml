name: Release binaries

# Called by release-plz.yml after it tags a release; run by hand to (re)build a past tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-15, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-15, smoke: false }
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Validate the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }'

      # Actions are pinned by commit SHA; the tag is only a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [[ "v$version" == "$TAG" ]] || { echo "Cargo.toml is $version, tag is $TAG"; exit 1; }

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      # ring compiles C; musl-gcc builds it for the static Linux targets
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      # No build cache: release binaries are built from scratch
      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        if: matrix.smoke
        run: |
          "target/$TARGET/release/sa-forge-signer" --version
          "target/$TARGET/release/sa-forge-signer-serve" --version
          "target/$TARGET/release/sa-forge-signer-mcp" --version

      - name: Package
        run: |
          name="sa-forge-signer-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/sa-forge-signer" "target/$TARGET/release/sa-forge-signer-serve" "target/$TARGET/release/sa-forge-signer-mcp" README.md CHANGELOG.md LICENSE-MIT UNLICENSE COPYING "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # --clobber lets a re-run replace the assets of the same tag
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
