name: apps

# The gates of the extras under apps/, apart from the signer's own (ci). Not a required check:
# it runs only when an app or its gate changes. The console is not here yet (GPUI's system libraries).
on:
  pull_request:
    paths:
      - "apps/**"
      - "scripts/ci/app-check.sh"
      - "scripts/ci/crate-age.sh"
      - "rust-toolchain.toml"
      - ".github/workflows/apps.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/ci/app-check.sh"
      - "scripts/ci/crate-age.sh"
      - "rust-toolchain.toml"
      - ".github/workflows/apps.yml"
  # Weekly, for new advisories against unchanged dependencies.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [grant, idl-table]
    steps:
      # Actions are pinned by commit SHA; the tag is only a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the wasm target
        if: matrix.app == 'grant'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/${{ matrix.app }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check
        env:
          APP: ${{ matrix.app }}
        run: scripts/ci/app-check.sh "$APP"
