# sa-forge-signer config. Default location: ~/.config/sa-forge-signer/config.toml
# Relative paths resolve against this file's directory.

cluster = "zink-testnet"
# rpc_url = "https://rpc1.z.ink"   # default for the cluster
# explorer_url = "https://explorer.z.ink"   # default for the cluster; for links only
# key_dir = "keys"                 # 0700; one 0600 file per key
# state_dir = "state"              # audit log
# Report what the instruction table (just apps idl-table) says about each payload; never refuses.
# instruction_table = { path = "zink-testnet.json", sha256 = "SHA256_OF_THE_FILE", mode = "report" }

# A SAGE-scoped session key. Signs without asking. The config holds no key index: the agent passes
# the key's profile index (the next free one when granted, not always 1) as forge-mcp's keyIndex.
# Paste the block `sa-forge-signer key new <name> --class session` prints, or uncomment and fill in.
# [keys.alice-session]
# class = "session"
# pubkey = "PUBKEY_FROM_key_new"
# profile = "PROFILE_ADDRESS"
# rate_limit_per_minute = 30
# daily_lamport_cap = 50000000     # 0.05 ZINK
# halt_after_unknown = 3           # halt the key after this many unknown outcomes in a row; 0 never
# require_policy_approval = false  # sign only while the policy digest is the one `key approve` accepted
# max_compute_units = 1400000      # highest SetComputeUnitLimit
# max_compute_unit_price = 0       # highest SetComputeUnitPrice (micro-lamports); 0: no priority fee
# extra_programs = []               # more programs this key may call at the top level. They are
#                                   # NOT trusted as game programs: token accounts can't be created
#                                   # for accounts they own. Add only programs you trust.

# Path A only: the profile authority and asset wallet held by the agent.
# Defaults to approval = "confirm": each signature is approved on the terminal.
# A wallet key cannot be "auto" or listed on a serve token: it signs only through the CLI
# with a person at the terminal. allow_unattended = true lifts both rules; use it only for a
# throwaway testnet key, since the signer does not decode what a profile grant gives away.
# [keys.alice-wallet]
# class = "wallet"
# pubkey = "WALLET_PUBKEY"
# transfer_to = ["PROFILE_ADDRESS", "SESSION_KEY_PUBKEY"]  # fund the vault and the session key
# transfer_max_lamports = 100000000                         # all transfers in one transaction

# `sa-forge-signer serve`: HTTP at /v1/check and /v1/sign, MCP at /mcp.
# [serve]
# listen = "127.0.0.1:8790"
# allowed_hosts = ["127.0.0.1", "localhost"]
# [[serve.tokens]]                  # from `sa-forge-signer token new <name> --out <file>`
# name = "agent"
# sha256 = "HASH_PRINTED_BY_token_new"
# keys = ["alice-session"]
