[package]
name = "sa-forge-signer-grant"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "A local web page where the profile authority's own wallet grants and revokes an sa-forge-signer session key on a SAGE profile. Spike."
license = "Unlicense OR MIT"
publish = false

# Its own workspace: kept out of the signer's build, release and dependency gates.
[workspace]

[dependencies]
base64 = "0.22.1"
bs58 = "0.5.1"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.104"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
