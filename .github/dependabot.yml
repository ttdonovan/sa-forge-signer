version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than 7 days, matching scripts/ci/crate-age.sh
    cooldown:
      default-days: 7
    # Conventional Commits, so release-plz reads them: "ci(deps): ..."
    commit-message:
      prefix: ci
      include: scope
    # Major bumps get their own PR
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
